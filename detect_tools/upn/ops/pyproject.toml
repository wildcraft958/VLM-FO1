[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "multiscale-deformable-attention"
version = "1.0.0"
description = "PyTorch bindings for Multi-Scale Deformable Attention"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "VLM-FO1 Maintainers" }
]
dependencies = []
keywords = ["upn", "deformable", "attention", "cuda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
