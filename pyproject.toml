[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-fo1"
dynamic = ["version"]
description = "VLM-FO1: Bridging the Gap Between High-Level Reasoning and Fine-Grained Perception"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    { name = "Om AI Lab" }
]
dependencies = [
    "torch>=2.1,<2.7",
    "torchvision>=0.16",
    "transformers>=4.45,<5.0",
    "timm>=0.9.0",
    "accelerate>=1.0",
    "safetensors>=0.4.0",
    "pillow>=9.0",
    "numpy>=1.21",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/om-ai-lab/VLM-FO1"
Repository = "https://github.com/om-ai-lab/VLM-FO1"
Issues = "https://github.com/om-ai-lab/VLM-FO1/issues"

[project.optional-dependencies]
# CUDA-specific torch variants (for explicit installation)
cu118 = [
    "torch>=2.1,<2.7",
]
# UPN detector dependencies
upn = [
    "mmcv>=2.0,<3.0",
    "mmengine>=0.10,<1.0",
]
# Demo and visualization
demo = [
    "gradio>=4.0",
    "scikit-image>=0.19",
]
# Development and testing
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
# All optional dependencies
all = [
    "vlm-fo1[upn,demo,dev]",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "vlm_fo1*",
    "detect_tools*",
]
exclude = [
    "assets*",
    "demo*",
    "evaluation*",
    "scripts*",
    "tests*",
    "bench*",
]

[tool.setuptools_scm]
# Dynamic versioning with ABI suffix support
version_scheme = "post-release"
local_scheme = "no-local-version"
write_to = "vlm_fo1/_version.py"
write_to_template = '''
# Auto-generated by setuptools_scm
__version__ = "{version}"
'''

# cibuildwheel configuration
[tool.cibuildwheel]
# Build only for Linux x86_64 (manylinux_2_28 for CUDA compatibility)
build = "cp39-* cp310-* cp311-*"
skip = "*-musllinux* *-manylinux_i686 *-win32 *-win_amd64 *-macosx*"
manylinux-x86_64-image = "manylinux_2_28"

# Environment variables for build
[tool.cibuildwheel.environment]
# Will be overridden by CI matrix
BUILD_CUDA = "cpu"

# Before build: install build dependencies
[tool.cibuildwheel.linux]
before-all = [
    "yum install -y gcc gcc-c++ make",
]

# Test command (basic import test)
test-command = "python -c 'import vlm_fo1; print(vlm_fo1.__version__)'"
test-requires = ["pytest"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# Ruff linter configuration (optional, for development)
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
